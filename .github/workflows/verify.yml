name: Verify SI100B course installers and student self-test
on:
  push:
    branches: [si100b-starter-audit]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'logisim-evolution-5.0.0-amd64.msi'
          Invoke-WebRequest 'https://github.com/Heaticy/logisim-evolution/releases/download/v5.0.0/logisim-evolution-5.0.0-amd64.msi' -OutFile $msi
          if ((Get-FileHash $msi).Hash -ne 'd3aff607d21a056a6240b890272428e7d7b362407001ac4b1e38e1235f6bebd9') { throw 'MSI hash mismatch.' }
          Write-Output ('MSI signature status: ' + (Get-AuthenticodeSignature -FilePath $msi).Status)
          $p = Start-Process msiexec.exe -ArgumentList @('/i', ('"{0}"' -f $msi), '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "MSI installation failed: $($p.ExitCode)" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine')+';'+[Environment]::GetEnvironmentVariable('Path','User')
          if (Get-Command logisim -ErrorAction SilentlyContinue) { throw 'Unexpected logisim alias.' }
          $zip = Join-Path $env:RUNNER_TEMP 'hw0.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'SI100B HW0 From ZIP'
          Invoke-WebRequest 'https://vsplab.cn/resources/uploads/3010a1640e0a52980d5fe8bb0585cb5b79d21dac90fab3c4bf167a3172b0815e/EE-HW0_student_starter.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne '3010a1640e0a52980d5fe8bb0585cb5b79d21dac90fab3c4bf167a3172b0815e') { throw 'Student ZIP hash mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $script = Join-Path $folder 'Self-Test.ps1'
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.Arguments = ('-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f $script)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.RedirectStandardInput = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          Start-Sleep -Seconds 6
          if ($process.HasExited) { throw "Script closed without waiting: $($output.Result) $($errors.Result)" }
          $process.StandardInput.WriteLine('')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Script did not exit.' }
          $result = $output.Result
          Write-Output $result
          if ($process.ExitCode -ne 1 -or ([regex]::Matches($result, '(?m)^FAIL (NAND1|NOR1|XOR1|MUX2|MUX4) - first mismatch')).Count -ne 5 -or $result -notmatch 'Press Enter to close') {
            throw "Expected five failed tests for the blank template and a prompt: $($errors.Result)"
          }
          $csv = Join-Path $folder 'student-output.csv'
          $lines = @(Get-Content -LiteralPath $csv)
          if ($lines.Count -ne 65 -or $lines[0] -cne 'count,NAND1,NOR1,XOR1,MUX2,MUX4' -or $lines[1] -cne '00000000,U,U,U,U,U') {
            throw 'Student CSV does not contain the expected header and 64 output rows.'
          }
          if ([IO.File]::ReadAllText($csv).Contains([char]13)) { throw 'Student CSV line endings differ from the reference.' }
          Write-Output $lines[0] $lines[1]
          exit 0
  mac:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          work="$(mktemp -d)"
          curl -fLsS --retry 3 -o "$work/logisim.pkg" 'https://github.com/Heaticy/logisim-evolution/releases/download/v5.0.0/logisim-evolution-5.0.0-aarch64.pkg'
          sudo /usr/sbin/installer -pkg "$work/logisim.pkg" -target /
          curl -fLsS --retry 3 -o "$work/EE-HW0_student_starter.zip" 'https://vsplab.cn/resources/uploads/3010a1640e0a52980d5fe8bb0585cb5b79d21dac90fab3c4bf167a3172b0815e/EE-HW0_student_starter.zip'
          printf '%s  %s\n' '3010a1640e0a52980d5fe8bb0585cb5b79d21dac90fab3c4bf167a3172b0815e' "$work/EE-HW0_student_starter.zip" | shasum -a 256 -c
          mkdir "$work/EE-HW0_student_starter"
          unzip -q "$work/EE-HW0_student_starter.zip" -d "$work/EE-HW0_student_starter"
          cd "$work/EE-HW0_student_starter"
          /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/zsh -lc 'command -v logisim-evolution && logisim-evolution --version'
          result=0
          /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/zsh -lc 'sh ./self-test.sh' > "$work/result.txt" 2>&1 || result=$?
          cat "$work/result.txt"
          test "$result" -eq 1
          test "$(grep -c '^FAIL ' "$work/result.txt")" -eq 5
          test "$(wc -l < student-output.csv)" -eq 65
          test "$(head -n 1 student-output.csv)" = 'count,NAND1,NOR1,XOR1,MUX2,MUX4'
          test "$(sed -n '2p' student-output.csv)" = '00000000,U,U,U,U,U'
