name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage_release:
        description: Stage the tested SI100B 5.0.0 installers as a draft release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux and JAR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Run tests and build
        run: ./gradlew test shadowJar createDeb
      - name: Verify English on a Chinese locale and launch at 2×
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find build/libs -name '*-all.jar' -print -quit)
          unzip -p "$jar" resources/logisim/settings.properties | grep '^locales.*\ben\b'
          if unzip -p "$jar" resources/logisim/settings.properties | grep -Eq '^locales.*\bzh\b'; then
            exit 1
          fi
          unzip -Z1 "$jar" > build/course-jar-files.txt
          if grep -E '(_zh(_[^/]*)?\.properties$|^doc/(zh/|doc_zh\.hs|map_zh\.jhm|search_lookup_zh/))' build/course-jar-files.txt; then
            exit 1
          fi
          java -Duser.language=zh -Duser.country=CN -Djava.awt.headless=true -jar "$jar" --help > build/course-help.txt
          grep -i 'usage:' build/course-help.txt
          sudo dpkg -i build/dist/*.deb
          test -x /usr/bin/logisim-evolution
          if ! command -v xwininfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y x11-utils
          fi
          xvfb-run -a -s '-screen 0 1920x1080x24' bash -euc '
            java -Duser.language=zh -Duser.country=CN -Dsun.java2d.uiScale=2 -jar "$1" > build/course-gui.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for attempt in {1..30}; do
              windows=$(xwininfo -root -tree)
              if grep -qi "Logisim-evolution" <<<"$windows"; then
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat build/course-gui.log >&2
                exit 1
              fi
              sleep 1
            done
            cat build/course-gui.log
            exit 1
          ' bash "$jar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            build/libs/*-all.jar
            build/dist/*.deb

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: |
          & .\gradlew.bat createMsi createWindowsPortableZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MSI installation and commands
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/dist/*.msi -ErrorAction Stop).FullName
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"{0}"' -f $msi), '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI install failed with $($install.ExitCode)" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $command = Get-Command 'logisim-evolution.exe' -CommandType Application -ErrorAction Stop
          $command | Select-Object -ExpandProperty Source
          if (Test-Path (Join-Path (Split-Path $command.Source) 'logisim.exe')) {
            throw 'Unexpected secondary launcher.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            build/dist/*.msi
            build/dist/*.zip

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Build macOS packages
        run: ./gradlew createDmg createPkg
      - name: Verify command installed by PKG
        run: |
          sudo installer -pkg build/dist/*.pkg -target /
          test "$(command -v logisim-evolution)" = /usr/local/bin/logisim-evolution
          test -x /Applications/Logisim-evolution.app/Contents/MacOS/Logisim-evolution
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          if-no-files-found: error
          path: |
            build/dist/*.dmg
            build/dist/*.pkg

  stage_release:
    name: Stage tested GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.stage_release && github.ref_name == 'si100b-5.0-source'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify the expected asset set and create the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_root="$PWD/release-assets"
          stage_dir=$(mktemp -d)
          cd "$stage_dir"
          expected=(
            logisim-evolution-5.0.0-all.jar
            logisim-evolution_5.0.0_amd64.deb
            logisim-evolution-5.0.0-amd64.msi
            logisim-evolution-5.0.0-windows-amd64.zip
            logisim-evolution-5.0.0-aarch64.dmg
            logisim-evolution-5.0.0-aarch64.pkg
            logisim-evolution-5.0.0-x86_64.dmg
            logisim-evolution-5.0.0-x86_64.pkg
          )
          for package in "${expected[@]}"; do
            mapfile -d '' matches < <(find "$asset_root" -type f -name "$package" -print0)
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp -- "${matches[0]}" "$package"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          cat > release-notes.md <<'MD'
          SI100B course edition based on Logisim-evolution 5.0.0. The interface starts in English and the Chinese translations are excluded. This build includes the upstream HiDPI fix for oversized canvas text.

          - **Windows (x64)**: The MSI adds `logisim-evolution` to PATH. Open a new terminal after installation. A portable ZIP is also available.
          - **macOS**: Choose the PKG for Apple Silicon (`aarch64`) or Intel (`x86_64`) to install the `logisim-evolution` command. The DMG is also available.
          - **Linux**: Use the Debian/Ubuntu x64 package or the cross-platform JAR. The JAR requires Java 21 or newer.

          [Upstream 5.0.0 release](https://github.com/logisim-evolution/logisim-evolution/releases/tag/v5.0.0) · [HiDPI patch](https://github.com/logisim-evolution/logisim-evolution/pull/3122)
          MD
          gh release create v5.0.0 "${expected[@]}" SHA256SUMS             --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA"             --title 'Logisim-evolution 5.0.0 · SI100B' --notes-file release-notes.md
