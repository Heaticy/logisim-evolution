name: Verify the corrected SI100B Windows installer
on:
  push:
    branches: [si100b-5.0-msi-shortcut]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Build the Windows MSI
        shell: pwsh
        run: |
          & .\gradlew.bat createMsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shortcuts, clean installation, and native CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem build/dist/*.msi).FullName
          $old = Join-Path $env:RUNNER_TEMP 'previous.msi'
          Invoke-WebRequest 'https://github.com/Heaticy/logisim-evolution/releases/download/v5.0.0/logisim-evolution-5.0.0-amd64.msi' -OutFile $old
          if ((Get-FileHash -LiteralPath $old).Hash -ne '04d143630607632072a2d7e4a34a55f75f0b26a268261cb843477efb1561148d') {
            throw 'The previous public MSI does not match the expected digest.'
          }

          function Read-Shortcuts([string] $File) {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($File,0))
            $query = 'SELECT `Directory_`, `Name`, `Target` FROM `Shortcut`'
            $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@($query))
            $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,@()) | Out-Null
            while ($record = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,@())) {
              $columns = foreach ($col in 1..3) {
                $record.GetType().InvokeMember('StringData','GetProperty',$null,$record,@($col))
              }
              [PSCustomObject]@{ Directory = $columns[0]; Name = $columns[1]; Target = $columns[2] }
            }
          }

          $oldShortcuts = @(Read-Shortcuts $old)
          $newShortcuts = @(Read-Shortcuts $msi)
          Write-Output 'Previous MSI shortcuts:'
          $oldShortcuts | Format-Table -AutoSize
          Write-Output 'Updated MSI shortcuts:'
          $newShortcuts | Format-Table -AutoSize
          if ($newShortcuts.Count -ne 2 -or @($newShortcuts | Where-Object { $_.Name -notmatch '(?i)logisim-evolution$' }).Count -ne 0) {
            throw 'Expected only the application desktop and Start Menu shortcuts.'
          }
          if ($oldShortcuts.Count -le $newShortcuts.Count) { throw 'No redundant shortcut was removed.' }
          if (@($newShortcuts | Select-Object -ExpandProperty Directory -Unique).Count -ne 2) {
            throw 'Application shortcuts must be in two separate locations.'
          }

          function Install-Msi([string] $file) {
            $p = Start-Process msiexec.exe -ArgumentList @('/i', ('"{0}"' -f $file), '/qn', '/norestart') -Wait -PassThru
            if ($p.ExitCode -notin @(0,3010)) { throw "MSI installation failed: $($p.ExitCode)" }
          }
          Install-Msi $msi
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          Get-Command logisim-evolution, logisim -CommandType Application -ErrorAction Stop | Select-Object -ExpandProperty Source
          $zip = Join-Path $env:RUNNER_TEMP 'hw0.zip'
          $example = Join-Path $env:RUNNER_TEMP 'SI100B HW0'
          Invoke-WebRequest 'https://vsplab.cn/resources/uploads/9fad5e4136796f77f2b57ee4b86f0a8a43550702ab7aedc718dbc53e5ee29e7f/SI100B-HW0-Student.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $example
          Push-Location -LiteralPath $example
          try {
            $output = & cmd.exe /d /c 'logisim-evolution --test-vector NAND1 "vectors\NAND1.txt" "ex1.circ"'
            $output | Write-Output
            if (($output -join "`n") -notmatch 'Passed:\s*0,\s*Failed:\s*4') { throw 'The native HW0 command did not return a test result.' }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Path windows-output | Out-Null
          Copy-Item -LiteralPath $msi -Destination windows-output/
          Copy-Item -LiteralPath $old -Destination windows-output/
          (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content windows-output/msi.sha256
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-msi
          path: windows-output/
          if-no-files-found: error
